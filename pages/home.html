<!--BigTitle-->
<div class="hero-scene text-center text-white">
    <div class="hero-scene-content">
        <h1>Covoiturez, économisez, protégez l'environnement</h1>
    </div>
</div>

<!--Carsharing form-->
<div class="container">
    <form id="carsharing-form">
        <div class="mb-3">
            <i class="icon bi bi-geo-alt-fill"></i>
            <label for="DepartureInput" class="form-label"></label>
            <input type="text" class="form-control" id="DepartureInput" placeholder="Départ">
        </div>
        <div class="mb-3">
            <i class="icon bi bi-geo-alt-fill"></i>
            <label for="ArrivalInput" class="form-label"></label>
            <input type="text" class="form-control" id="ArrivalInput" placeholder="Arrivée">
        </div>
        <div class="mb-3">
            <i class="icon bi bi-calendar3"></i>
            <label for="DateInput" class="form-label"></label>
            <input type="date" class="form-control" id="DateInput" placeholder="Date">
        </div>
        <div class="mb-3">
            <i class="icon bi bi-person-fill"></i>
            <select class="form-select" id="PassengerInput">
                <option selected>Nombre de passagers</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-primary" id="btn-Search">Rechercher</button>
        </div>
    </form>
</div>

<!--Carousel-->
<div id="carouselCaptions" class="container carousel slide">
  <div class="carousel-inner">
    <div class="carousel-item active">
        <div class="carousel-item-picture">
            <img src="/images/a_propos.jpg" class="d-block w-100" alt="Bureau">
            <div class="carousel-caption d-none d-md-block">
                <h2>A propos</h2>
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                </div>
            </div>
        </div>
        <div class="carousel-caption-description">
            <h5>EcoRide: plateforme de covoiturage</h5>
            <p>EcoRide prône une approche écologique et économique des déplacements</p>
        </div>
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
