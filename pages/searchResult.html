<div class="background">
<!--Carsharing form-->
<div class="container mb-3">
    <form id="carsharing-research-form">
        <div class="row align-items-center">
            <div class="col-3 d-flex align-items-center justify-content-end">
            <i class="bi bi-search"></i>
            </div>
            <div class="col-6">
                <div class="row mb-3">
                    <div class="col-4 d-flex align-items-center">
                        <label for="DepartureInput" class="form-label"></label>
                        <input type="text" class="form-control" id="DepartureInput" placeholder="Départ">
                    </div>
                    <div class="col-1 d-flex align-items-center">
                        <i class="bi bi-arrow-right"></i>
                    </div>
                    <div class="col-4 d-flex align-items-center">
                        <label for="ArrivalInput" class="form-label"></label>
                        <input type="text" class="form-control" id="ArrivalInput" placeholder="Arrivée">
                    </div>
                </div>
                <div class="row">
                    <div class="col-3 d-flex align-items-center">
                        <label for="DateInput" class="form-label"></label>
                        <input type="date" class="form-control" id="DateInput" placeholder="Date">
                    </div>
                    <div class="col-2">

                    </div>
                    <div class="col-4 d-flex align-items-center">
                        <select class="form-select" id="PassengerInput">
                            <option selected>Nombre de passagers</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-3 d d-flex align-items-center justify-content-start">
                <div class="text-center">
                    <button type="submit" class="btn btn-primary" id="btn-Search">Rechercher</button>
                </div>
            </div>           
        </div>         
    </form>
</div>

<!--Carsharing results-->
    <div class="container">
        <div class="search-result">
            <h2 class="text-center">Trajets disponibles</h2>
            <ul id="results" class="list-group">
                <div class="row align-items-center">
                    <div class="row">
                        <div class="col-2 d-flex align-items-center">
                            <label for="DepartureHourInput" class="form-label"></label>
                            <input type="hour" class="form-control" id="DepartureHourInput" placeholder="Heure">
                        </div>
                        <div class="col-2 d-flex align-items-center">
                        </div>
                        <div class="col-2 d-flex align-items-center">
                            <label for="DepartureInput" class="form-label"></label>
                            <input type="text" class="form-control" id="DepartureInput" placeholder="Départ">
                        </div>
                        <div class="col-2 d-flex align-items-center">
                        </div>
                        <div class="col-2 d-flex align-items-center">
                            <label for="PriceInput" class="form-label"></label>
                            <input type="text" class="form-control" id="PriceInput" placeholder="XX€">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-2 d-flex align-items-center">
                            <label for="TravelDurationInput" class="form-label"></label>
                            <input type="hour" class="form-control" id="TravelDurationInput" placeholder="Durée">
                        </div>
                        <div class="col-2 d-flex align-items-center">
                            <i class="bi bi-chevron-double-down"></i>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-2 d-flex align-items-center">
                            <label for="ArrivalHourInput" class="form-label"></label>
                            <input type="hour" class="form-control" id="ArrivalHourInput" placeholder="Heure">
                        </div>
                        <div class="col-2 d-flex align-items-center">
                        </div>
                        <div class="col-2 d-flex align-items-center">
                            <label for="ArrivalInput" class="form-label"></label>
                            <input type="text" class="form-control" id="ArrivalInput" placeholder="Arrivée">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-4 d-flex align-items-center">
                        </div>
                        <div class="col-2 d-flex align-items-center">
                            <input type="text" class="form-control" id="PassengerInput" placeholder="Nombre de passagers">
                            <label for="PassengerInput" class="form-label">passager(s)</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-4 d-flex align-items-center">
                        </div>
                        <div class="col-2 d-flex align-items-center">
                            <label for="EcologicalInput" class="form-label">Voyage écologique:</label>
                            <input type="text" class="form-control" id="EcologicalInput" placeholder="oui/non">
                        </div>
                    </div>
                </div>

            </ul>






            <!--Navigation between pages-->
            <nav aria-label="Page navigation example">
                <ul class="pagination justify-content-center">
                    <li class="page-item disabled">
                        <a class="page-link">Previous</a>
                    </li>
                    <li class="page-item active">
                        <a class="page-link" href="#" aria-current="page">1</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">2</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">3</a>
                    </li>
                    <li class="page-item">
                        <a class="page-link" href="#">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</div>
