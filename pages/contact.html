<div class="background">
    <!--BigTitle-->
    <div class="hero-scene text-center text-white">
        <div class="hero-scene-content">
            <h1>Formulaire de contact</h1>
        </div>
    </div>

<!--Contact form-->
    <div class="container">
        <form id="connexion-form">
            <div class="mb-3">
                <label for="LastNameInput" class="form-label">Nom</label>
                <input type="text" class="form-control" id="LastNameInput" placeholder="Votre nom">
                <div class="invalid-feedback">
                    Le nom est requis.
                </div>
            </div>
            <div class="mb-3">
                <label for="FirstNameInput" class="form-label">Prénom</label>
                <input type="text" class="form-control" id="FirstNameInput" placeholder="Votre prénom">
                <div class="invalid-feedback">
                    Le prénom est requis.
                </div>
            </div>
            <div class="mb-3">
                <label for="EmailInput" class="form-label">Email</label>
                <input type="email" class="form-control" id="EmailInput" placeholder="adresse@exemple.fr">
                <div class="invalid-feedback">
                    L'email n'est pas au bon format.
                </div>
            </div>
            <div class="mb-3">
                <label for="Message" class="form-message">Message</label>
                <input type="text" class="form-control" id="MessageInput" placeholder="Indiquer votre message ici">
            </div>
            <div class="text-center">
                <button type="button" class="btn btn-primary" id="btn-send-message">Envoyer</button>
            </div>
        </form>
    </div>
</div>
